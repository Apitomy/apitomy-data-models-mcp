name: NPM Publish Workflow
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 1.1.0)'
        required: true
      branch:
        description: 'Branch/tag to publish from'
        required: true
        default: 'main'
  workflow_call:
    inputs:
      release-version:
        description: 'Release version to publish'
        required: true
        type: string
      branch:
        description: 'Branch/tag to publish from'
        required: true
        type: string
      quiet:
        description: 'Leave the Slack notification to the caller'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    steps:

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          registry-url: 'https://registry.npmjs.org'


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Data Models MCP version $RELEASE_VERSION to NPM"
          echo "Publishing from branch/tag: $BRANCH"
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          BRANCH: ${{ inputs.branch }}


      - name: Code Checkout
        run: |
          git init
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git remote add origin "https://apitomy-ci:${ACCESS_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch
          git checkout "$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}


      - name: Build and Test
        run: |
          npm install
          npm run build
          npm test


      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''

      # Slack, when run on its own: success to the general channel, failure to the
      # important one. release.yaml reports the publishes it calls itself.
      - name: Notify
        if: ${{ !cancelled() && !inputs.quiet }}
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ job.status == 'success' && 'general' || 'important' }}
          text: "${{ job.status == 'success' && format(':package: {0}: {1} published {2}', github.repository, github.workflow, inputs.release-version) || format(':x: {0}: {1} failed for {2}', github.repository, github.workflow, inputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ job.status != 'success' && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
